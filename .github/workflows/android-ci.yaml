name: Android CI

on:
  pull_request:
    branches: [ "master", "development" ]

jobs:
  test-and-detekt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > ./app/google-services.json

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/development' }}

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Verify Coverage Gate
        run: ./gradlew koverVerify

      - name: Generate Coverage Report
        if: always()
        run: ./gradlew koverHtmlReport

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: 'build/reports/kover/html/'

      - name: Record Screenshot Tests
        run: ./gradlew recordPaparazziDebug

      - name: Upload Paparazzi Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-snapshots
          path: '**/src/test/snapshots/'

      - name: Upload Paparazzi Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-report
          path: '**/build/reports/paparazzi/'

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Upload Detekt Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: '**/build/reports/detekt/'

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: '**/build/reports/lint-results-debug.html'

      - name: Build Release APK (R8 minified)
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Run Lint (release)
        run: ./gradlew lintRelease

      - name: Upload Release Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-release
          path: '**/build/reports/lint-results-release.html'

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: '**/build/outputs/apk/release/*.apk'
